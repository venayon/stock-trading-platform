<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>Trade validation · Stock Trader</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #172b3a;
      background: #f3f6f8;
    }

    body {
      max-width: 780px;
      margin: 3rem auto;
      padding: 0 1.25rem;
    }

    main {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #dbe3e8;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
    }

    a {
      color: #075b9a;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
    }

    input, select {
      box-sizing: border-box;
      width: 100%;
      margin-top: .4rem;
      padding: .7rem;
      border: 1px solid #8b9da9;
      border-radius: 5px;
      font: inherit;
    }

    [aria-invalid="true"] {
      border: 2px solid #a62121;
    }

    .error {
      color: #a62121;
      font-size: .85rem;
      min-height: 1rem;
      display: block;
      margin-top: .3rem;
    }

    button {
      margin-top: 1.2rem;
      padding: .8rem 1.2rem;
      background: #075b9a;
      color: white;
      border: 0;
      border-radius: 5px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eef3f6;
      padding: 1rem;
    }

    :focus-visible {
      outline: 3px solid #d28300;
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .fields {
        grid-template-columns: 1fr;
      }

      main {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
<main>
  <h1>Trade validation</h1>
  <p>Check a synthetic trade and preview its normalized values. This preview does not save or publish a trade.</p>
  <p><a href="/swagger-ui.html">Swagger API documentation</a> · <a href="/v3/api-docs">OpenAPI JSON</a></p>
  <form id="trade-form" novalidate>
    <div class="fields">
      <div><label for="tradeDate">Trade date</label><input aria-describedby="tradeDate-error" id="tradeDate" name="tradeDate" required
                                                           type="date"><span class="error"
                                                                                                    id="tradeDate-error"></span>
      </div>
      <div><label for="side">Side</label><select aria-describedby="side-error" id="side" name="side" required>
        <option>BUY</option>
        <option>SELL</option>
      </select><span class="error" id="side-error"></span></div>
      <div><label for="symbol">Symbol</label><input aria-describedby="symbol-error" id="symbol" name="symbol" placeholder="AAPL"
                                                    required><span class="error"
                                                                                          id="symbol-error"></span></div>
      <div><label for="quantity">Quantity</label><input aria-describedby="quantity-error" id="quantity" inputmode="numeric"
                                                        name="quantity" placeholder="10"
                                                        required><span class="error"
                                                                                                id="quantity-error"></span>
      </div>
      <div><label for="price">Price</label><input aria-describedby="price-error" id="price" inputmode="decimal" name="price"
                                                  placeholder="123.450000" required><span class="error"
                                                                                                id="price-error"></span>
      </div>
      <div><label for="currency">Currency</label><select aria-describedby="currency-error" id="currency"
                                                         name="currency">
        <option>USD</option>
        <option>GBP</option>
        <option>EUR</option>
      </select><span class="error" id="currency-error"></span></div>
      <div><label for="counterparty">Counterparty (optional)</label><input aria-describedby="counterparty-error" id="counterparty"
                                                                           name="counterparty"><span
        class="error" id="counterparty-error"></span></div>
    </div>
    <button id="submit" type="submit">Validate trade</button>
  </form>
  <p aria-live="polite" id="status" role="status"></p>
  <pre hidden id="preview"></pre>
  <noscript>JavaScript is required for this form. You can use the validation API directly.</noscript>
</main>
<script src="/form.mjs" type="module"></script>
</body>
</html>
